[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-model-fingerprint-scanner"
version = "0.1.0"
description = "Fast account-level model-family fingerprint screening through a Sub2API gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
codex-fingerprint-scan = "codex_fingerprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
